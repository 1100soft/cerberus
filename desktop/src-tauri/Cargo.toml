[package]
name = "gitcerberus"
version = "0.1.0"
description = "A repository-first workspace guardian"
authors = ["GitCerberus contributors"]
edition = "2021"

[lib]
name = "gitcerberus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "gitcerberus"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# Build DBus from source on Linux. This keeps `npm run tauri dev` working on
# development machines that have the normal Tauri GUI libraries but not the
# distro-specific libdbus development package.
[target.'cfg(target_os = "linux")'.dependencies]
dbus = { version = "0.9", features = ["vendored"] }

[dev-dependencies]
tempfile = "3"
