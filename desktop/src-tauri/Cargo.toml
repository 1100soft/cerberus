[package]
name = "gitcerberus"
version = "0.1.0"
description = "A repository-first workspace guardian"
authors = ["GitCerberus contributors"]
edition = "2021"

[lib]
name = "gitcerberus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "gitcerberus"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
semver = "1"
base64 = "0.22"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
github-copilot-sdk = "1.0.14"
tokio = { version = "1", features = ["time", "sync"] }
notify = "8.2.0"
imap = "2.4.1"
native-tls = "0.2"
mailparse = "0.16"
lettre = "0.11"

# Use the distribution's poll()-enabled D-Bus build. libdbus-sys vendoring falls
# back to select() and corrupts its stack for descriptors >= FD_SETSIZE.
[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9"
