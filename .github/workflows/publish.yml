name: Stable desktop release
'on':
  push:
    tags:
    - v*.*.*
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: stable-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  candidate:
    if: github.ref_name != 'autosave' && !startsWith(github.ref_name, 'autosave/')
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - uses: actions/setup-node@v6
      with:
        node-version: '22'
    - name: Validate stable tag and main ancestry
      id: candidate
      env:
        RELEASE_TAG: ${{ github.ref_name }}
        REF_TYPE: ${{ github.ref_type }}
      run: |
        set -euo pipefail
        test "$REF_TYPE" = tag
        [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
        git merge-base --is-ancestor HEAD origin/main
        node desktop/scripts/check-release-version.mjs
        echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  checks:
    needs: candidate
    uses: ./.github/workflows/ci.yml
  packages:
    needs: checks
    uses: ./.github/workflows/desktop-packages.yml
  github-release:
    needs:
    - candidate
    - packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v6
    - uses: actions/download-artifact@v4
      with:
        pattern: gitcerberus-*
        path: release-artifacts
    - name: Prepare release assets and checksums
      run: python3 .github/scripts/prepare-release-assets.py release-artifacts release-assets
    - name: Create or finish draft release
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ github.ref_name }}
        RELEASE_SHA: ${{ needs.candidate.outputs.sha }}
      run: bash .github/scripts/draft-release.sh
  apt:
    needs:
    - packages
    - github-release
    permissions:
      contents: read
      actions: read
    uses: 1100soft/CI/.github/workflows/apt-publish.yml@859fc753347512c1e64d50f487251d41b0778925
    with:
      artifact-inputs: '{"gitcerberus-x86_64-unknown-linux-gnu": "apt-input"}'
      prepare-command: |
        RELEASE_TAG="${{ github.ref_name }}"
        set -euo pipefail
        mapfile -d '' packages < <(find apt-input -type f -name '*.deb' -print0)
        test "${#packages[@]}" -eq 1
        package="${packages[0]}"
        test "$(dpkg-deb --field "$package" Package)" = gitcerberus
        test "v$(dpkg-deb --field "$package" Version)" = "$RELEASE_TAG"
        test "$(dpkg-deb --field "$package" Architecture)" = amd64
        mkdir -p apt-packages
        cp "$package" "apt-packages/gitcerberus_${RELEASE_TAG#v}_amd64.deb"
    secrets:
      APT_DISPATCH_TOKEN: ${{ secrets.APT_DISPATCH_TOKEN }}
  promote:
    if: vars.CERBERUS_PUBLISH_STABLE_RELEASE == 'true'
    needs:
    - github-release
    - apt
    runs-on: ubuntu-24.04
    environment: stable-release
    permissions:
      contents: write
    steps:
    - name: Publish reviewed draft
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RELEASE_TAG: ${{ github.ref_name }}
      run: gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
