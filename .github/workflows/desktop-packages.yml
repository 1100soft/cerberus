name: Desktop packages
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: desktop-packages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    if: github.ref_name != 'autosave' && !startsWith(github.ref_name, 'autosave/')
    uses: ./.github/workflows/tauri-package.yml
    with:
      app-directory: desktop
      artifact-prefix: gitcerberus
      version-check-command: node scripts/check-release-version.mjs
      build-matrix: >-
        {"include":[
          {"os":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu","bundles":"deb,appimage"},
          {"os":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu","bundles":"deb,appimage"},
          {"os":"windows-2022","target":"x86_64-pc-windows-msvc","bundles":"nsis"},
          {"os":"macos-15","target":"aarch64-apple-darwin","bundles":"app,dmg"},
          {"os":"macos-15-intel","target":"x86_64-apple-darwin","bundles":"app,dmg"}
        ]}
