name: Desktop CI

on:
  workflow_call:
  push:
    tags-ignore: ['**']
    branches-ignore: ['autosave', 'autosave/**']
  pull_request:
    branches-ignore: ['autosave', 'autosave/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  workflows:
    if: >-
      github.ref_name != 'autosave' && !startsWith(github.ref_name, 'autosave/') &&
      github.head_ref != 'autosave' && !startsWith(github.head_ref, 'autosave/')
    name: Validate workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Release tooling regressions
        run: python3 .github/scripts/check-release-tooling.py
      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  desktop:
    if: >-
      github.ref_name != 'autosave' && !startsWith(github.ref_name, 'autosave/') &&
      github.head_ref != 'autosave' && !startsWith(github.head_ref, 'autosave/')
    uses: ./.github/workflows/tauri-check.yml
    with:
      app-directory: desktop
      check-command: |
        node scripts/check-release-version.mjs
        node scripts/check-chatgpt-capabilities.mjs
        node scripts/check-conversation-display.mjs
        node scripts/check-chat.mjs
        node scripts/check-conversation-recovery.mjs
        node scripts/check-automation-inputs.mjs
      linux-check-command: bash scripts/check-webkit-ci.sh
