name: Desktop CI

on:
  push:
    branches-ignore: ['autosave', 'autosave/**']
  pull_request:
    branches-ignore: ['autosave', 'autosave/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  workflows:
    if: >-
      github.ref_name != 'autosave' && !startsWith(github.ref_name, 'autosave/') &&
      github.head_ref != 'autosave' && !startsWith(github.head_ref, 'autosave/')
    name: Validate workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  desktop:
    if: >-
      github.ref_name != 'autosave' && !startsWith(github.ref_name, 'autosave/') &&
      github.head_ref != 'autosave' && !startsWith(github.head_ref, 'autosave/')
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            python3-gi gir1.2-gtk-3.0 gir1.2-webkit2-4.1 xvfb xauth
      - run: npm ci
      - run: npm run build
      - name: Check release version consistency
        run: node scripts/check-release-version.mjs
      - name: Frontend logic checks
        run: |
          node scripts/check-chatgpt-capabilities.mjs
          node scripts/check-conversation-display.mjs
          node scripts/check-chat.mjs
          node scripts/check-conversation-recovery.mjs
          node scripts/check-automation-inputs.mjs
      - name: Compile native app and tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --no-run
      - name: Native regression tests
        if: runner.os == 'Linux'
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked -- --test-threads=1
      - name: WebKit integration checks
        if: runner.os == 'Linux'
        run: bash scripts/check-webkit-ci.sh
