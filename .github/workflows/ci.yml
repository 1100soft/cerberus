name: Desktop CI

on:
  workflow_call:
  push:
    tags-ignore: ['**']
    branches-ignore: ['autosave', 'autosave/**']
  pull_request:
    branches-ignore: ['autosave', 'autosave/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  workflows:
    if: >-
      github.ref_name != 'autosave' && !startsWith(github.ref_name, 'autosave/') &&
      github.head_ref != 'autosave' && !startsWith(github.head_ref, 'autosave/')
    name: Validate workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Release tooling regressions
        run: python3 .github/scripts/check-release-tooling.py
      - name: Lint GitHub Actions workflows
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tool_dir=$(mktemp -d "$RUNNER_TEMP/actionlint.XXXXXX")
          curl --fail --location --retry 3 --output "$tool_dir/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "$ACTIONLINT_SHA256  $tool_dir/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$tool_dir/actionlint.tar.gz" -C "$tool_dir" actionlint
          "$tool_dir/actionlint" -color

  desktop:
    if: >-
      github.ref_name != 'autosave' && !startsWith(github.ref_name, 'autosave/') &&
      github.head_ref != 'autosave' && !startsWith(github.head_ref, 'autosave/')
    uses: 1100soft/CI/.github/workflows/tauri-check.yml@31cd08b2a9314c358ce2589a095b5cbeb8dcadf7
    with:
      app-directory: desktop
      check-command: |
        node scripts/check-repositories.mjs
        node scripts/check-release-version.mjs
        node scripts/check-chatgpt-capabilities.mjs
        node scripts/check-conversation-display.mjs
        node scripts/check-chat.mjs
        node scripts/check-conversation-recovery.mjs
        node scripts/check-automation-inputs.mjs
      linux-check-command: bash scripts/check-webkit-ci.sh
